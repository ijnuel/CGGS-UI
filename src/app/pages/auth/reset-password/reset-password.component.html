<div class="w-full">
  <div class="mb-8">
    <h3 class="text-[var(--app-primary)] font-bold">Reset Password</h3>
    <p class="text-gray-400 text-sm mt-1">Enter your new password below.</p>
  </div>

  <form [formGroup]="formGroup" (submit)="onSubmit()" class="flex flex-col gap-5">
    <mat-form-field hideRequiredMarker>
      <mat-label>New Password</mat-label>
      <input
        matInput
        [formControl]="formControl.newPassword"
        [type]="showPassword ? 'text' : 'password'"
      />
      <span class="material-icons cursor-pointer" matSuffix (click)="showPassword = !showPassword">
        {{ showPassword ? 'visibility_off' : 'visibility' }}
      </span>
      <mat-error *ngIf="formControl.newPassword.hasError('minlength')">
        Password must be at least 6 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field hideRequiredMarker>
      <mat-label>Confirm New Password</mat-label>
      <input
        matInput
        [formControl]="formControl.confirmNewPassword"
        [type]="showPassword ? 'text' : 'password'"
      />
      <mat-error *ngIf="formControl.confirmNewPassword.hasError('mismatch')">
        Passwords do not match
      </mat-error>
    </mat-form-field>

    <button
      type="submit"
      [disabled]="formGroup.invalid"
      class="sec-btn py-3 rounded-lg font-semibold text-sm tracking-wide"
    >
      Reset Password
    </button>
  </form>

  <div class="mt-6 text-center">
    <a routerLink="/auth/login" class="text-[var(--app-accent)] font-semibold text-sm hover:underline">
      &larr; Back to Sign In
    </a>
  </div>
</div>
