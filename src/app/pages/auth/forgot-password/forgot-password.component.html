<div class="w-full">
  <div class="mb-8">
    <h3 class="text-[var(--app-primary)] font-bold">Forgot Password</h3>
    <p class="text-gray-400 text-sm mt-1">Enter your email and we'll send you a reset link.</p>
  </div>

  <ng-container *ngIf="!sent; else sentMsg">
    <form [formGroup]="formGroup" (submit)="onSubmit()" class="flex flex-col gap-5">
      <mat-form-field hideRequiredMarker>
        <mat-label>Email Address</mat-label>
        <input matInput [formControl]="formControl.email" type="email" />
        <mat-error *ngIf="formControl.email.hasError('email')">Enter a valid email address</mat-error>
      </mat-form-field>

      <button
        type="submit"
        [disabled]="formGroup.invalid"
        class="sec-btn py-3 rounded-lg font-semibold text-sm tracking-wide"
      >
        Send Reset Link
      </button>
    </form>
  </ng-container>

  <ng-template #sentMsg>
    <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-green-800 text-sm">
      If that email is registered, a password reset link has been sent. Please check your inbox.
    </div>
  </ng-template>

  <div class="mt-6 text-center">
    <a routerLink="/auth/login" class="text-[var(--app-accent)] font-semibold text-sm hover:underline">
      &larr; Back to Sign In
    </a>
  </div>
</div>
