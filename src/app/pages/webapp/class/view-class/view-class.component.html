<div class="p-6">
  <div class="flex items-center gap-3 mb-6">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2 class="text-2xl font-bold text-gray-800">Class Students</h2>
  </div>

  <!-- Class Information and Session Selection -->
  <div *ngIf="class$ | async as cls" class="bg-white rounded-lg shadow-md p-6 mb-6">
    <div class="flex items-center justify-between gap-4 flex-wrap">
      <div>
        <h3 class="text-lg font-semibold mb-1">Class Information</h3>
        <p class="text-gray-600">
          <strong>Class:</strong>
          {{ cls.classLevel?.name }} {{ cls.classLevel?.level }} {{ cls.name }}
        </p>
        <p *ngIf="cls.classLevel?.programmeTypeId" class="text-sm text-gray-400 mt-0.5">
          Programme Type ID: {{ cls.classLevel?.programmeTypeId | slice:0:8 }}…
        </p>
      </div>
      <div class="w-64">
        <app-searchable-mat-select
          [options]="(sessions$ | async) ?? []"
          label="Session"
          placeholder="Select Session"
          valueKey="id"
          [labelKeys]="['name']"
          [formControl]="sessionForm.controls.sessionId"
          (selectionChange)="onSessionChange($event)"
        ></app-searchable-mat-select>
      </div>
    </div>
  </div>

  <!-- Students Table -->
  <div *ngIf="selectedSessionId" class="bg-white rounded-lg shadow-md p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold">Students in Class</h3>
      <div class="flex gap-2">
        <button mat-raised-button color="primary" (click)="showAddStudent()">
          <mat-icon class="mr-1">person_add</mat-icon>
          Add Student
        </button>
        <button mat-raised-button color="accent" (click)="onRefresh()" [disabled]="loading$ | async">
          <mat-icon class="mr-1">refresh</mat-icon>
          Refresh
        </button>
      </div>
    </div>

    <app-table
      [tableHeaderData]="tableHeaderData"
      [tableData]="(studentClassList$ | async)?.data ?? []"
      [totalLength]="(studentClassList$ | async)?.totalCount ?? 0"
      [isLoading]="(loading$ | async) ?? false"
      [showFilters]="true"
      [showActionColumn]="true"
      (queryChange)="onQueryChange($event)"
      (view)="onView($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      [showViewIcon]="false"
      [showEditIcon]="false"
    ></app-table>
  </div>

  <!-- Add Student Modal -->
  <div *ngIf="showAddStudentDialog"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md mx-4">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-semibold">Add Student to Class</h3>
        <button mat-icon-button (click)="hideAddStudent()">
          <mat-icon class="text-gray-400">close</mat-icon>
        </button>
      </div>

      <form [formGroup]="studentForm" class="flex flex-col gap-3">

        <!-- Student picker -->
        <div>
          <app-searchable-mat-select
            [options]="(allStudents$ | async) ?? []"
            label="Student"
            placeholder="Search by name…"
            valueKey="id"
            [labelFn]="getStudentLabelFn"
            [formControl]="studentForm.controls.studentId"
          ></app-searchable-mat-select>
          <mat-error *ngIf="studentForm.controls.studentId.touched && studentForm.controls.studentId.invalid"
            class="text-xs">Student is required</mat-error>
        </div>

        <!-- Stream picker (only when the class has streams) -->
        <div *ngIf="availableStreams.length > 0">
          <mat-form-field class="w-full form-input">
            <mat-label>Stream</mat-label>
            <mat-select [formControl]="studentForm.controls.streamId">
              <mat-option *ngFor="let s of availableStreams" [value]="s.id">{{ s.name }}</mat-option>
            </mat-select>
            <mat-error>Stream is required</mat-error>
          </mat-form-field>
        </div>

      </form>

      <div class="flex justify-end gap-2 mt-5">
        <button mat-button (click)="hideAddStudent()">Cancel</button>
        <button mat-raised-button color="primary"
          (click)="addStudentToClass()"
          [disabled]="studentClassLoading$ | async">
          <mat-icon class="mr-1">add</mat-icon>
          Add Student
        </button>
      </div>
    </div>
  </div>
</div>
