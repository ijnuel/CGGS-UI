@if (
  {
    loading: loading$ | async,
    dropdownLoading: dropdownLoading$ | async,
    error: error$ | async
  };
  as obs
) {
<div class="pl-8 pr-9 pt-6">
  <div class="flex item-center justify-between">
    <div class="text-xl font-bold">{{ isEditMode ? 'Edit' : 'Create' }} Class</div>
  </div>

  <div class="mt-8">
    <form [formGroup]="formGroup">
      <div class="grid grid-cols-2 gap-x-4 mt-2">
        <div>
          <mat-form-field class="form-input">
            <mat-label>Name</mat-label>
            <input
              type="text"
              autocomplete="off"
              matInput
              [formControl]="formControl.name"
            />
            <mat-error>
              {{ getErrorMessage("name") }}
            </mat-error>
          </mat-form-field>
        </div>
        <div>
          <mat-form-field class="form-input">
            <mat-label>Next Class (Promotion target)</mat-label>
            <mat-select [formControl]="formControl.nextClassId">
              <mat-option [value]="null">— None —</mat-option>
              <mat-option *ngFor="let c of classAll$ | async" [value]="c.id">
                {{ c.name }}
              </mat-option>
            </mat-select>
            <mat-hint>Class students are promoted into after this one</mat-hint>
          </mat-form-field>
        </div>
      </div>
    </form>

    <div class="actions-btn flex justify-end mt-10 gap-5 form-container mx-auto px-3">
      <button class="cancel-btn" routerLink="/app/class">Cancel</button>
      <button class="sec-btn" (click)="submit()" [disabled]="obs.loading">
        {{ isEditMode ? 'Update' : 'Submit' }}
      </button>
    </div>
  </div>
</div>
}
