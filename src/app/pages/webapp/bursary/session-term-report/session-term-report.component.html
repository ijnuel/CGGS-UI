<div class="pl-8 pr-9 pt-6">
  <div class="flex items-center gap-2 mb-2 -ml-3">
    <button mat-icon-button routerLink="/app/bursary/reports" aria-label="Back to reports" style="color: var(--app-primary);">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="text-xl font-bold">{{ config.title }}</div>
  </div>
  <p class="text-sm text-gray-500 mb-6">{{ config.description }}</p>

  <form [formGroup]="form" class="mb-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2 mb-4">
      <app-searchable-mat-select
        [options]="sessions"
        label="Session"
        placeholder="Select session"
        valueKey="id"
        [labelKeys]="['name']"
        [formControl]="form.controls.sessionId">
      </app-searchable-mat-select>

      <app-searchable-mat-select
        [options]="terms"
        [label]="config.termRequired ? 'Term' : 'Term (optional — leave blank for the whole session)'"
        [placeholder]="config.termRequired ? 'Select term' : 'All terms'"
        valueKey="value"
        [formControl]="form.controls.term">
      </app-searchable-mat-select>
    </div>
  </form>

  <div class="flex justify-end">
    <button class="sec-btn" (click)="generate()" [disabled]="generating || form.invalid">
      {{ generating ? 'Generating...' : config.buttonLabel }}
    </button>
  </div>
</div>
