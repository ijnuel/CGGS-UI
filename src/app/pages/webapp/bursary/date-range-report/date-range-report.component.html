<div class="pl-8 pr-9 pt-6">
  <div class="flex items-center gap-2 mb-2 -ml-3">
    <button mat-icon-button routerLink="/app/bursary/reports" aria-label="Back to reports" style="color: var(--app-primary);">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="text-xl font-bold">{{ config.title }}</div>
  </div>
  <p class="text-sm text-gray-500 mb-6">{{ config.description }}</p>

  <form [formGroup]="form" class="mb-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2 mb-4">
      <mat-form-field class="form-input">
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate" [max]="today" />
        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
        <mat-error>Required</mat-error>
      </mat-form-field>

      <mat-form-field class="form-input">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate" [max]="today" />
        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
        <mat-error>Required</mat-error>
      </mat-form-field>
    </div>
    <p *ngIf="rangeInvalid" class="text-sm text-red-600">End date cannot be before start date.</p>
  </form>

  <div class="flex justify-end">
    <button class="sec-btn" (click)="generate()" [disabled]="generating || form.invalid || rangeInvalid">
      {{ generating ? 'Generating...' : config.buttonLabel }}
    </button>
  </div>
</div>
