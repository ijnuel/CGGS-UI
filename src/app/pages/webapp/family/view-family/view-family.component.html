<div class="p-6">
  <h3 class="text-xl font-semibold">View Family</h3>
  <div class="flex justify-start mb-5 mt-4">
    <button mat-button (click)="goBack()" class="flex items-center gap-1">
      <mat-icon>arrow_back</mat-icon>
      <span>Back</span>
    </button>
  </div>
  <div *ngIf="family$ | async as family">
    <p><strong>Name:</strong> {{ family.lastName }}</p>
    <div class="mt-4 flex gap-2">
      <app-support-sign-in-button [userId]="family.userId" [name]="(family.firstName ?? '') + ' ' + family.lastName">
      </app-support-sign-in-button>
      <app-reset-password-button [userId]="family.userId" [name]="(family.firstName ?? '') + ' ' + family.lastName" [email]="family.email">
      </app-reset-password-button>
    </div>
    <!-- Add more fields as needed -->
  </div>
  <div *ngIf="!(family$ | async)">
    <p>Loading...</p>
  </div>
</div>
